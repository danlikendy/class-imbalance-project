name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (XeLaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-cyrillic fonts-liberation
      - name: Build PDF
        run: make
